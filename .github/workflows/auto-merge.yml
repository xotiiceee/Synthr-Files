name: Auto Squash-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        run: |
          # Enable auto-merge so GitHub merges automatically once all
          # required branch-protection checks are green.
          gh pr merge "$PR_URL" --squash --auto --delete-branch || true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
