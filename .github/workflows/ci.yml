name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pulse-frontend:
    name: Pulse Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pulse
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/pulse/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: apps/pulse/frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/pulse/frontend
        run: pnpm lint

      - name: Typecheck
        working-directory: apps/pulse/frontend
        run: pnpm exec tsc -b

      - name: Build UI
        working-directory: apps/pulse/frontend
        run: pnpm build

  pulse-backend:
    name: Pulse Backend (cargo build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pulse/backend
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/pulse/backend

      - name: Install system deps (qdrant client, openssl)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Build backend
        working-directory: apps/pulse/backend
        run: cargo build --release

      - name: Check
        working-directory: apps/pulse/backend
        run: cargo check --release

  synthr-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/synthr
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/synthr/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
