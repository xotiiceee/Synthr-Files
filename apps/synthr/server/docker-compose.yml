services:
  synthr-cyber:
    build: .
    container_name: synthr-cyber
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # For future data layer
    # volumes:
    #   - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Optional: Add Postgres + pgvector later for production data layer
#   db:
#     image: pgvector/pgvector:pg16
#     ...
